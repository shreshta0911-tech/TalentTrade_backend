spring.application.name=talenttrade-backend
server.port=${PORT:8085}

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/talenttrade_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
talenttrade.upload.dir=./uploads

# JWT Security
talenttrade.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
talenttrade.jwt.expiration-ms=86400000

# CORS
talenttrade.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
